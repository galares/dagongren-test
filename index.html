<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>测测你是哪种打工人</title>
<style>
  :root{
    --bg:#f6f1e9; --card:#fffdf9; --ink:#2b2622; --sub:#7a6f66; --line:#e7ddd0;
    --accent:#e2603a; --accent-soft:#fbe3d9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    -webkit-tap-highlight-color:transparent}
  .wrap{max-width:440px;margin:0 auto;padding:20px 16px 40px;min-height:100vh;display:flex;flex-direction:column}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;
    box-shadow:0 6px 24px rgba(80,50,20,.06)}
  .hide{display:none!important}
  /* 首页 */
  .cover{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center}
  .badge{display:inline-block;align-self:center;background:var(--accent-soft);color:var(--accent);
    font-size:13px;padding:4px 12px;border-radius:99px;font-weight:600}
  .cover h1{font-size:34px;line-height:1.25;letter-spacing:1px}
  .cover h1 em{font-style:normal;color:var(--accent)}
  .cover p{color:var(--sub);font-size:15px;line-height:1.7}
  .types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
  .types span{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:8px 2px;font-size:13px;color:var(--sub);white-space:nowrap}
  .feat{display:flex;justify-content:center;gap:14px;color:var(--sub);font-size:13px}
  .feat b{color:var(--accent);font-weight:700}
  .btn{display:block;width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;
    font-size:17px;font-weight:700;padding:15px;cursor:pointer;transition:transform .1s;font-family:inherit}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
  /* 答题 */
  .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 18px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .qmeta{display:flex;justify-content:space-between;color:var(--sub);font-size:13px}
  .qtext{font-size:21px;line-height:1.5;font-weight:700;margin-bottom:18px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;
    padding:14px 14px;font-size:15.5px;line-height:1.5;color:var(--ink);cursor:pointer;font-family:inherit}
  .opt:hover{border-color:var(--accent)}
  .opt.on{border-color:var(--accent);background:var(--accent-soft)}
  .back{margin-top:16px;background:none;border:0;color:var(--sub);font-size:14px;cursor:pointer;align-self:flex-start;font-family:inherit}
  /* 结果卡（一屏可截图） */
  .share{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 16px 12px;
    text-align:center;box-shadow:0 6px 24px rgba(80,50,20,.08);overflow:hidden;position:relative}
  .share::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--tc,var(--accent))}
  .share small{display:block;color:var(--sub);font-size:12.5px;margin-top:4px}
  .res-icon{width:52px;height:52px;margin:8px auto 4px;border-radius:16px;display:grid;place-items:center;
    font-size:26px;font-weight:800;color:#fff}
  .res-name{font-size:38px;font-weight:800;letter-spacing:3px;line-height:1.2}
  .res-tag{font-weight:600;margin-top:4px;font-size:15px}
  .kw{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:10px}
  .kw span{font-size:13px;padding:3px 11px;border-radius:99px;font-weight:600}
  .radar{display:block;width:100%;max-width:290px;height:auto;margin:6px auto 0}
  .share-foot{margin-top:8px;color:#a99d92;font-size:11.5px;letter-spacing:1px}
  .tip{margin-top:12px;text-align:center;color:var(--sub);font-size:13px}
  /* 详情 */
  .detail{margin-top:14px}
  .res-desc{font-size:15px;line-height:1.8;color:#3d3631}
  .sec{margin-top:14px}
  .sec h3{font-size:14px;color:var(--sub);font-weight:600;margin-bottom:6px}
  .sec p{font-size:15px;line-height:1.7}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips span{font-size:13px;padding:4px 10px;border-radius:99px}
  .dist{display:flex;flex-direction:column;gap:7px}
  .row{display:grid;grid-template-columns:80px 1fr 38px;align-items:center;gap:8px;font-size:13px}
  .row .t{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .row .t i{display:block;height:100%;border-radius:99px}
  .row b{text-align:right;font-weight:600;color:var(--sub)}
  .actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  footer{margin-top:22px;text-align:center;color:#a99d92;font-size:12px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">

  <!-- 首页 -->
  <section id="cover" class="cover">
    <span class="badge">24 道题 · 约 4 分钟</span>
    <h1>测测你是<br>哪种<em>打工人</em></h1>

  </section>

    <div class="bar"><i id="prog"></i></div>
    <div class="card">
      <div class="qtext" id="qtext"></div>
      <div class="opts" id="opts"></div>
    </div>
    <button class="back" id="backBtn">‹ 上一题</button>
  </section>

  <!-- 结果 -->
  <section id="result" class="hide">
    <div class="share" id="share">
      <small>你的打工人类型是</small>
      <div class="res-icon" id="rIcon"></div>
      <div class="res-name" id="rName"></div>
      <div class="res-tag" id="rTag"></div>
      <div class="kw" id="rKw"></div>
      <svg class="radar" id="rRadar" viewBox="0 0 300 215" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="六维雷达图"></svg>
      <div class="share-foot">测测你是哪种打工人</div>
    </div>
    <p class="tip">↑ 截这一屏发朋友圈，看看朋友是哪一型</p>
    <div class="card detail">
      <p class="res-desc" id="rDesc"></p>
      <div class="sec"><h3>你的闪光点</h3><div class="chips" id="rGood"></div></div>
      <div class="sec"><h3>你的六维小结</h3><p id="rDim"></p></div>
      <div class="sec"><h3>要小心的地方</h3><p id="rCare"></p></div>
      <div class="sec"><h3>最佳工作搭子</h3><p id="rMate"></p></div>
      <div class="sec"><h3>给你的一句话</h3><p id="rTip"></p></div>
      <div class="sec"><h3>你的成分构成</h3><div class="dist" id="rDist"></div></div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="againBtn">再测一次</button>
    </div>
  </section>

  <footer>本测试仅供娱乐，不构成任何心理评估或职业建议</footer>
</div>

/*SCORE-START*/
// ans：每题选了第几个选项（0–3）
function typeOf(qi, oi){ return QS[qi][1][oi][1]; }
function scoreAnswers(ans){
  const score = Object.fromEntries(ORDER.map(k=>[k,0]));
  ans.forEach((oi,qi)=>{ score[typeOf(qi,oi)]++; });
  return score;
}
// 维度：把每个选项所属类型的维度画像累计取平均，减去 8 种画像的整体均值再放大对比度，限制在 10–96
function calcDims(ans){
  const sum = DIMS.map(()=>0);
  ans.forEach((oi,qi)=>{ TYPES[typeOf(qi,oi)].prof.forEach((v,d)=>{ sum[d]+=v; }); });
  const n = ans.length || 1;
  return sum.map((s,d)=>{
    const c = ORDER.reduce((t,k)=>t+TYPES[k].prof[d],0)/ORDER.length;
    const v = 50 + (s/n - c)*4;
    return Math.round(Math.min(96, Math.max(10, v)));
  });
}
// 最高分并列时，用答案算一个固定的数来挑，不偏向任何类型
function pickTop(score, ans){
  const max = Math.max(...ORDER.map(k=>score[k]));
  const tied = ORDER.filter(k=>score[k]===max);
  if (tied.length===1) return tied[0];
  let h = 7;
  ans.forEach((oi,qi)=>{ h = (h*31 + (qi+1)*(oi+2)) % 100003; });
  return tied[h % tied.length];
}
/*SCORE-END*/

/*UI-START*/
const $ = id => document.getElementById(id);
let cur = 0, ans = [];

function show(id){ ["cover","quiz","result"].forEach(s=>$(s).classList.toggle("hide", s!==id)); window.scrollTo(0,0); }

$("coverChips").innerHTML = ORDER.map(k=>`<span>${TYPES[k].name}</span>`).join("");

function renderQ(){
  const [q, opts] = QS[cur];
  $("qnum").textContent = `第 ${cur+1} / ${QS.length} 题`;
  $("prog").style.width = (cur/QS.length*100)+"%";
  $("qtext").textContent = q;
  $("opts").innerHTML = "";
  opts.forEach(([t],i)=>{
    const b = document.createElement("button");
    b.className = "opt" + (ans[cur]===i ? " on" : "");
    b.textContent = "ABCD"[i] + ". " + t;
    b.onclick = () => { ans[cur]=i; b.classList.add("on"); setTimeout(next, 180); };
    $("opts").appendChild(b);
  });
  $("backBtn").style.visibility = cur ? "visible" : "hidden";
}

function next(){
  if (cur < QS.length-1){ cur++; renderQ(); } else { renderResult(ans); }
}

// 六维雷达图（纯 SVG）
function radarSVG(dims, color){
  const cx=150, cy=108, R=76, N=dims.length;
  const pt = (i,r)=>{ const a=(-90+i*360/N)*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
  const poly = (r)=>Array.from({length:N},(_,i)=>pt(i,r).map(x=>x.toFixed(1)).join(",")).join(" ");
  let s = "";
  [0.33,0.66,1].forEach(f=>{ s += `<polygon points="${poly(R*f)}" fill="none" stroke="#e7ddd0" stroke-width="1"/>`; });
  for (let i=0;i<N;i++){ const [x,y]=pt(i,R); s += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e7ddd0" stroke-width="1"/>`; }
  const dp = dims.map((v,i)=>pt(i,R*v/100).map(x=>x.toFixed(1)).join(",")).join(" ");
  s += `<polygon points="${dp}" fill="${color}" fill-opacity=".22" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>`;
  dims.forEach((v,i)=>{ const [x,y]=pt(i,R*v/100); s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${color}"/>`; });
  DIMS.forEach((n,i)=>{
    const [x,y]=pt(i,R+13);
    const anchor = Math.abs(x-cx)<4 ? "middle" : (x>cx ? "start" : "end");
    const dy = i===0 ? -3 : (i===3 ? 10 : 4);
    s += `<text x="${x.toFixed(1)}" y="${(y+dy).toFixed(1)}" text-anchor="${anchor}" font-size="12.5" fill="#5a4f46" font-weight="600">${n} <tspan fill="${color}">${dims[i]}</tspan></text>`;
  });
  return s;
}

function renderResult(answers){
  const score = scoreAnswers(answers);
  const top = pickTop(score, answers);
  const dims = calcDims(answers);
  const T = TYPES[top];
  $("share").style.setProperty("--tc", T.color);
  $("rIcon").textContent = T.icon; $("rIcon").style.background = T.color;
  $("rName").textContent = T.name; $("rName").style.color = T.color;
  $("rTag").textContent = T.tag;  $("rTag").style.color = T.color;
  $("rKw").innerHTML = T.kw.map(g=>`<span style="color:${T.color};background:${T.color}1a">${g}</span>`).join("");
  $("rRadar").innerHTML = radarSVG(dims, T.color);
  $("rDesc").textContent = T.desc;
  $("rGood").innerHTML = T.good.map(g=>`<span style="color:${T.color};background:${T.color}1a">${g}</span>`).join("");
  const hi = dims.indexOf(Math.max(...dims)), lo = dims.indexOf(Math.min(...dims));
  $("rDim").textContent = `最突出的是「${DIMS[hi]}」（${dims[hi]}），最需要留意的是「${DIMS[lo]}」（${dims[lo]}）。分数只反映这次作答的倾向，换个心情再测可能不一样。`;
  $("rCare").textContent = T.care;
  $("rMate").textContent = T.mate;
  $("rTip").textContent = T.tip;
  const sorted = [...ORDER].sort((a,b)=>score[b]-score[a]);
  $("rDist").innerHTML = sorted.map(k=>{
    const p = Math.round(score[k]/answers.length*100);
    return `<div class="row"><span>${TYPES[k].name}</span><div class="t"><i style="width:${p}%;background:${TYPES[k].color}"></i></div><b>${p}%</b></div>`;
  }).join("");
  show("result");
}

$("startBtn").onclick = () => { cur=0; ans=[]; show("quiz"); renderQ(); };
$("backBtn").onclick = () => { if(cur>0){ cur--; renderQ(); } };
$("againBtn").onclick = () => { cur=0; ans=[]; show("cover"); };

  if (!k) return;
  // 能选自己这一型就选，选不到就轮流选别的，保证结果稳定
  const fake = QS.map((q,qi)=>{ const i = q[1].findIndex(o=>o[1]===k); return i>=0 ? i : (qi%4); });
  renderResult(fake);
})();
